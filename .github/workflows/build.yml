name: rebuild

on:
  push:
    branches: [main]
    paths: ["book/**", "build.py", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: 生成单文件阅读页
        run: python build.py -o index.html
      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot@users.noreply.github.com]"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html 无变化"
          else
            git commit -m "chore: 重新生成 index.html（正文更新后自动构建）"
            git push
          fi
